name: Track upstream DiPlay releases
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: upstream-release-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release selection and integrity rules
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Mirror original upstream APK and source, with C11 companion
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/sync_upstream.py
