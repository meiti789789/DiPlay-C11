name: Build and release C11 bridge
on:
  push:
    branches: [main]
    tags: ['bridge-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify media protocol
        run: python3 scripts/test_protocol.py
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Build test APK and run Android lint
        run: ./gradlew --no-daemon :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: C11-WheelBridge-test
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.*
      - name: Restore private release signing key
        if: startsWith(github.ref, 'refs/tags/bridge-v')
        env:
          KEY_B64: ${{ secrets.C11_SIGNING_KEY_B64 }}
        run: |
          test -n "$KEY_B64" || { echo 'Release signing secret is missing; refusing a differently signed APK.'; exit 1; }
          umask 077
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/c11-release.p12"
      - name: Build signed bridge release
        if: startsWith(github.ref, 'refs/tags/bridge-v')
        env:
          C11_KEYSTORE: ${{ runner.temp }}/c11-release.p12
          C11_STORE_PASSWORD: ${{ secrets.C11_STORE_PASSWORD }}
          C11_KEY_ALIAS: c11bridge
          C11_KEY_PASSWORD: ${{ secrets.C11_STORE_PASSWORD }}
        run: |
          test "$GITHUB_REF_NAME" = "bridge-v$(python3 -c 'import json;print(json.load(open("version.json"))["name"])')"
          ./gradlew --no-daemon :app:assembleRelease
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/C11-WheelBridge-${GITHUB_REF_NAME#bridge-v}.apk"
          git archive --format=zip --prefix=C11-WheelBridge/ HEAD > release/C11-WheelBridge-source.zip
          cp 使用说明.md release/C11-Guide-ZH.md
          (cd release && sha256sum *.apk *.zip > SHA256SUMS.txt)
      - name: Publish physical-test prerelease
        if: startsWith(github.ref, 'refs/tags/bridge-v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --prerelease --title "C11 方控桥接 ${GITHUB_REF_NAME#bridge-v} · 待实车验证" --notes-file RELEASE_NOTES.md
